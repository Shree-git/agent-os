name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Package release archive
        shell: bash
        env:
          AGENT_OS_SIGN_RELEASES: "1"
        run: ./scripts/package-release.sh ${{ matrix.target }}

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/dist/*.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
            target/dist/*.tar.gz.sig
            target/dist/*.tar.gz.pem
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
