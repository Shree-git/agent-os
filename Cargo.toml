[package]
name = "agent_os"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local operating system for coordinating AI agents, tasks, memory, and execution events."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Shree-git/agent-os"
documentation = "https://docs.rs/agent_os"
keywords = ["agents", "automation", "scheduler", "local-first", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agent-os"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "5"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tabled = "0.16"
thiserror = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
